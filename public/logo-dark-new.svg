<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none" role="img" aria-label="tldbi dark logo">
  <defs>
    <linearGradient id="logo-grad-dark" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
  </defs>

  <!-- Icon badge -->
  <g>
    <rect x="4" y="4" width="56" height="56" rx="16" fill="#1e293b"/>
    <rect x="8" y="8" width="48" height="48" rx="12" fill="url(#logo-grad-dark)"/>
    
    <!-- Data comparison bars -->
    <g fill="#0f172a" opacity="0.9">
      <rect x="18" y="30" width="4" height="10" rx="2"/>
      <rect x="24" y="26" width="4" height="14" rx="2"/>
      <rect x="30" y="22" width="4" height="18" rx="2"/>
      <rect x="36" y="28" width="4" height="12" rx="2"/>
      <rect x="42" y="24" width="4" height="16" rx="2"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g>
    <text x="72" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700" letter-spacing="-0.5" fill="#e2e8f0">tldbi</text>
    <text x="156" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700" fill="#cbd5e1" opacity="0.6">.com</text>
  </g>
</svg>