<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="tldbi icon">
  <defs>
    <linearGradient id="icon-gradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b63f6"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12" flood-color="#0b63f6"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="url(#icon-gradient)" filter="url(#shadow)"/>
  
  <!-- Grid pattern representing data/comparison -->
  <g opacity="0.2" stroke="#ffffff" stroke-width="1">
    <line x1="14" y1="20" x2="14" y2="44"/>
    <line x1="24" y1="20" x2="24" y2="44"/>
    <line x1="34" y1="20" x2="34" y2="44"/>
    <line x1="44" y1="20" x2="44" y2="44"/>
    <line x1="54" y1="20" x2="54" y2="44"/>
  </g>
  
  <!-- TLD indicator bars (representing price comparison) -->
  <g fill="#ffffff">
    <!-- Bar 1 -->
    <rect x="16" y="32" width="4" height="12" rx="2"/>
    <!-- Bar 2 -->
    <rect x="24" y="28" width="4" height="16" rx="2"/>
    <!-- Bar 3 -->
    <rect x="32" y="24" width="4" height="20" rx="2"/>
    <!-- Bar 4 -->
    <rect x="40" y="30" width="4" height="14" rx="2"/>
  </g>
</svg>