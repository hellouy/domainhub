<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="tldbi large icon">
  <defs>
    <linearGradient id="large-gradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b63f6"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="large-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" flood-color="#0b63f6"/>
    </filter>
  </defs>
  
  <rect width="128" height="128" rx="32" fill="url(#large-gradient)" filter="url(#large-shadow)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="2">
    <line x1="28" y1="40" x2="28" y2="88"/>
    <line x1="48" y1="40" x2="48" y2="88"/>
    <line x1="68" y1="40" x2="68" y2="88"/>
    <line x1="88" y1="40" x2="88" y2="88"/>
    <line x1="108" y1="40" x2="108" y2="88"/>
  </g>
  
  <!-- Comparison bars -->
  <g fill="#ffffff">
    <rect x="32" y="64" width="8" height="24" rx="4"/>
    <rect x="48" y="56" width="8" height="32" rx="4"/>
    <rect x="64" y="48" width="8" height="40" rx="4"/>
    <rect x="80" y="60" width="8" height="28" rx="4"/>
    <rect x="96" y="52" width="8" height="36" rx="4"/>
  </g>
</svg>