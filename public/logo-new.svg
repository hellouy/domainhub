<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none" role="img" aria-label="tldbi premium logo">
  <defs>
    <linearGradient id="logo-grad-primary" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b63f6"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
  </defs>

  <!-- Icon badge -->
  <g>
    <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#logo-grad-primary)" opacity="0.12"/>
    <rect x="8" y="8" width="48" height="48" rx="12" fill="url(#logo-grad-primary)"/>
    
    <!-- Data comparison bars inside icon -->
    <g fill="#f8fbff" opacity="0.95">
      <rect x="18" y="30" width="4" height="10" rx="2"/>
      <rect x="24" y="26" width="4" height="14" rx="2"/>
      <rect x="30" y="22" width="4" height="18" rx="2"/>
      <rect x="36" y="28" width="4" height="12" rx="2"/>
      <rect x="42" y="24" width="4" height="16" rx="2"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g>
    <!-- Brand text -->
    <text x="72" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700" letter-spacing="-0.5" fill="#0f172a">tldbi</text>
    
    <!-- Domain suffix -->
    <text x="156" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700" fill="#0f172a" opacity="0.5">.com</text>
  </g>
</svg>