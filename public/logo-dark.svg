<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none" role="img" aria-label="tldbi dark mode logo">
  <defs>
    <linearGradient id="dark-grad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
  </defs>
  <!-- Icon Badge -->
  <g>
    <rect x="4" y="4" width="56" height="56" rx="16" fill="#1e293b"/>
    <rect x="8" y="8" width="48" height="48" rx="12" fill="url(#dark-grad)"/>
    <!-- Geometric D -->
    <path d="M24 20h12c8 0 14.4 5.2 14.4 12s-6.4 12-14.4 12H24V20zm9.6 8v8h2.8c4 0 6.4-2 6.4-4s-2.4-4-6.4-4h-2.8z" fill="#0f172a"/>
    <!-- Accent dot -->
    <circle cx="50" cy="24" r="3.2" fill="#0f172a" opacity="0.7"/>
  </g>
  
  <!-- Wordmark -->
  <g>
    <!-- Brand name -->
    <text x="72" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700" letter-spacing="-0.5" fill="#e2e8f0">tldbi</text>
    <!-- Domain suffix -->
    <text x="156" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700" fill="#cbd5e1" opacity="0.7">.com</text>
    <!-- Divider line -->
    <line x1="72" y1="48" x2="200" y2="48" stroke="#60a5fa" stroke-width="1.5" opacity="0.4"/>
  </g>
</svg>