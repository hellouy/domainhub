<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tldbi.com Brand Demo</title>
  <style>
    :root {
      --bg1: #071426;
      --bg2: #0f172a;
      --bg3: #0b63f6;
      --bg4: #7dd3fc;
      --card: rgba(15, 23, 42, 0.28);
      --stroke: rgba(255,255,255,0.18);
      --text: #f8fbff;
      --muted: rgba(255,255,255,0.7);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #edf7ff 0%, #e2f0ff 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .demo {
      width: min(1200px, calc(100vw - 32px));
      aspect-ratio: 1200 / 630;
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid rgba(15,23,42,0.08);
      box-shadow: 0 24px 60px rgba(15,23,42,0.15);
      background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 18%, var(--bg3) 58%, var(--bg4) 100%);
      color: var(--text);
      position: relative;
      padding: 44px 54px;
    }
    .demo::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 82% 22%, rgba(255,255,255,0.2), transparent 18%), radial-gradient(circle at 20% 80%, rgba(125,211,252,0.2), transparent 24%);
    }
    .inner {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .icon {
      width: 68px; height: 68px;
      border-radius: 18px;
      background: linear-gradient(135deg, #e2f3ff 0%, #9ad4ff 100%);
      display: grid;
      place-items: center;
      box-shadow: 0 12px 28px rgba(11,99,246,0.42);
    }
    .bars {
      display: flex; align-items: flex-end; gap: 6px; height: 20px;
    }
    .bars span {
      width: 5px; display: block; border-radius: 3px; background: #0b63f6;
    }
    .bars span:nth-child(1) { height: 8px; }
    .bars span:nth-child(2) { height: 12px; }
    .bars span:nth-child(3) { height: 18px; }
    .bars span:nth-child(4) { height: 14px; }
    .name {
      font-size: 30px; font-weight: 800; letter-spacing: -1px;
    }
    .badge {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 10px 16px; border-radius: 999px; background: var(--card); border: 1px solid var(--stroke);
      font-size: 18px; font-weight: 700; letter-spacing: 0.5px;
    }
    .content {
      display: flex; justify-content: space-between; align-items: flex-end; flex: 1; margin-top: 30px; gap: 24px;
    }
    .left {
      flex: 1.25; display: flex; flex-direction: column; justify-content: center;
    }
    .title {
      font-size: clamp(42px, 6vw, 82px);
      font-weight: 900;
      line-height: 0.96;
      letter-spacing: -3px;
      margin: 0;
    }
    .tags {
      margin-top: 22px; display: flex; flex-wrap: wrap; gap: 12px;
    }
    .tag {
      min-width: 96px; height: 42px; padding: 0 18px; border-radius: 999px; background: rgba(15, 23, 42, 0.34); border: 1px solid var(--stroke); display: inline-flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700;
    }
    .right {
      flex: 0.7; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 18px;
    }
    .price-card {
      background: rgba(15, 23, 42, 0.27); border: 1px solid var(--stroke); border-radius: 26px; padding: 28px 26px; min-width: 300px; box-shadow: 0 18px 32px rgba(15,23,42,0.18);
    }
    .from {
      font-size: 18px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase;
    }
    .price {
      font-size: 62px; font-weight: 900; line-height: 1; letter-spacing: -2px; margin-top: 8px;
    }
    .unit {
      font-size: 22px; color: rgba(255,255,255,0.82); margin-top: 10px;
    }
    .meta {
      display: flex; gap: 18px; flex-wrap: wrap;
    }
    .meta-item {
      padding: 10px 16px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); font-size: 18px; font-weight: 700; color: #e2f3ff;
    }
  </style>
</head>
<body>
  <div class="demo" role="img" aria-label="tldbi social preview card">
    <div class="inner">
      <div class="topbar">
        <div class="brand">
          <div class="icon">
            <div class="bars"><span></span><span></span><span></span><span></span></div>
          </div>
          <div class="name">tldbi.com</div>
        </div>
        <div class="badge">LIVE PRICING</div>
      </div>

      <div class="content">
        <div class="left">
          <p class="title">最便宜的</p>
          <p class="title">域名价格</p>

          <div class="tags">
            <span class="tag">.com</span>
            <span class="tag">.io</span>
            <span class="tag">.ai</span>
            <span class="tag">.shop</span>
            <span class="tag">.info</span>
            <span class="tag">.xyz</span>
          </div>
        </div>

        <div class="right">
          <div class="price-card">
            <div class="from">from</div>
            <div class="price">US$ 8.99</div>
            <div class="unit">/ year</div>
          </div>
          <div class="meta">
            <span class="meta-item">1,800+ TLDs</span>
            <span class="meta-item">200+ registrars</span>
            <span class="meta-item">real-time</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
