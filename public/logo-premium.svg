<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none" role="img" aria-label="tldbi premium logo">
  <defs>
    <linearGradient id="premium-grad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b63f6"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b63f6"/>
    </linearGradient>
  </defs>
  <!-- Icon Badge -->
  <g>
    <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#premium-grad)" opacity="0.12"/>
    <rect x="8" y="8" width="48" height="48" rx="12" fill="url(#premium-grad)"/>
    <!-- Geometric D -->
    <path d="M24 20h12c8 0 14.4 5.2 14.4 12s-6.4 12-14.4 12H24V20zm9.6 8v8h2.8c4 0 6.4-2 6.4-4s-2.4-4-6.4-4h-2.8z" fill="#f8fbff"/>
    <!-- Accent dot -->
    <circle cx="50" cy="24" r="3.2" fill="#f8fbff" opacity="0.8"/>
  </g>
  
  <!-- Wordmark -->
  <g>
    <!-- Brand name with gradient -->
    <text x="72" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700" letter-spacing="-0.5" fill="url(#text-grad)">tldbi</text>
    <!-- Domain suffix -->
    <text x="156" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700" fill="#0f172a" opacity="0.6">.com</text>
    <!-- Divider line -->
    <line x1="72" y1="48" x2="200" y2="48" stroke="url(#premium-grad)" stroke-width="1.5" opacity="0.3"/>
  </g>
</svg>